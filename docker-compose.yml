# docker-compose.yml
services:
  mysql:
    image: mysql:8.4
    container_name: mysql8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: myapp
      MYSQL_USER: myapp
      MYSQL_PASSWORD: myapp123
    ports:
      - "3306:3306"
    command: [ "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci" ]
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
